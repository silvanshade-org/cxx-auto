[workspace]
resolver = "2"
members = [
  "crates/cxx-auto",
  "crates/cxx-auto-build",
  "crates/cxx-auto-example",
]

[workspace.dependencies]
cc = { version = "1.0", features = ["parallel"] }
cxx = { version = "1.0", features = ["c++20"] }
cxx-auto = { path = "crates/cxx-auto" }
cxx-auto-build = { path = "crates/cxx-auto-build" }
cxx-build = { version = "1.0", default-features = false, features = ["parallel"] }
