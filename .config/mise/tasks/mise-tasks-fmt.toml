#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

[treefmt]
description = "Run treefmt without a cache that ignores Git commit identity"
run = "treefmt --no-cache"

["treefmt:check"]
description = "Check formatting and generated history against the current commits"
run = "treefmt --no-cache --fail-on-change"

["lint:cpp"]
description = "Analyze the cxx_auto module and the C++ translation units that import it"
run = """
cargo build --quiet
flags="-std=c++26 -resource-dir=$(clang -print-resource-dir) -fno-exceptions -fno-rtti -Icxx/include -Itarget/cxxbridge"
mkdir -p target/cxx-auto-tidy
clang --gcc-toolchain=/usr $flags --precompile -x c++-module cxx/module/cxx_auto.cppm -o target/cxx-auto-tidy/cxx_auto.pcm
clang-tidy --quiet --warnings-as-errors='*' cxx/module/cxx_auto.cppm -- $flags -x c++-module
clang-tidy --quiet --warnings-as-errors='*' cxx/tests/probes.cxx cxx/lib/cmake.cxx -- $flags -fmodule-file=cxx_auto=target/cxx-auto-tidy/cxx_auto.pcm
"""

["changelog:install"]
description = "Install the reviewed shared changelog generator"
run = "cargo install --git https://github.com/silvanshade-org/workflow --rev 60169a4e02a4afb5e21eccd3779ab3d29a0b38ea --locked workflow-changelog"

["changelog:render"]
description = "Render release history using the current PR title and Git tags"
depends = ["changelog:install"]
run = "workflow-changelog --exclude-path CHANGELOG.md"
